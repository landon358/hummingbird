<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Field workshop | Hummingbird</title>
<style>
:root{
  --bg:#09090b;--fg:#ecede8;
  --dim:color-mix(in srgb,var(--fg) 58%,var(--bg));
  --faint:color-mix(in srgb,var(--fg) 34%,var(--bg));
  --hair:color-mix(in srgb,var(--fg) 12%,transparent);
  --mono:ui-monospace,'SF Mono',Menlo,monospace;
  --sans:system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:400 13px/1.5 var(--sans);overflow:hidden}
canvas#field{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}

/* sample copy, to judge how the field sits behind real text */
.sample{position:fixed;inset:0;z-index:1;display:grid;align-content:center;
  padding:0 clamp(24px,7vw,120px);pointer-events:none;opacity:0;transition:opacity .4s ease}
.sample.on{opacity:1}
.sample h1{font:500 clamp(40px,7vw,86px)/1.02 var(--sans);letter-spacing:-.03em;max-width:15ch;
  text-shadow:0 2px 40px rgba(0,0,0,.55)}
.sample p{margin-top:20px;max-width:46ch;color:var(--dim);font-size:17px;line-height:1.55;
  text-shadow:0 2px 30px rgba(0,0,0,.6)}
.sample .cta{margin-top:28px;display:inline-flex;width:max-content;padding:13px 22px;border-radius:999px;
  background:var(--fg);color:#000;font-weight:500}

/* control panel */
#panel{position:fixed;top:0;right:0;bottom:0;width:330px;z-index:5;overflow-y:auto;
  background:color-mix(in srgb,#000 72%,transparent);backdrop-filter:blur(16px);
  border-left:1px solid var(--hair);padding:14px 14px 40px}
#panel.hide{transform:translateX(100%)}
#panel{transition:transform .35s cubic-bezier(.32,.72,0,1)}
#toggle{position:fixed;top:12px;right:12px;z-index:6;padding:7px 12px;border-radius:999px;
  border:1px solid var(--hair);background:rgba(0,0,0,.6);color:var(--fg);font:500 12px var(--sans);cursor:pointer}
h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:16px 0 8px}
h2:first-of-type{margin-top:4px}
.row{display:grid;grid-template-columns:1fr 46px;gap:8px;align-items:center;margin:7px 0}
.row label{font-size:12px;color:var(--dim)}
.row output{font:400 11px var(--mono);color:var(--faint);text-align:right}
.row input[type=range]{grid-column:1/-1;width:100%;height:3px;-webkit-appearance:none;appearance:none;
  background:var(--hair);border-radius:99px;outline:none}
.row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
  background:var(--fg);cursor:pointer}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:8px 0}
.swatches input[type=color]{width:100%;height:26px;padding:0;border:1px solid var(--hair);border-radius:6px;
  background:none;cursor:pointer}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
button.chip,select,textarea{font:400 12px var(--sans);color:var(--fg);background:rgba(255,255,255,.06);
  border:1px solid var(--hair);border-radius:8px;padding:6px 10px;cursor:pointer}
button.chip.on{background:var(--fg);color:#000;border-color:var(--fg)}
select{width:100%;padding:7px 10px}
textarea{width:100%;height:120px;font:400 11px/1.45 var(--mono);resize:vertical;cursor:text}
.check{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12px;color:var(--dim);cursor:pointer}
.check input{accent-color:var(--fg)}
#fps{position:fixed;left:12px;top:12px;z-index:6;font:400 11px var(--mono);color:var(--faint)}
.hint{font-size:11px;color:var(--faint);margin:6px 0 2px}
</style></head><body>

<canvas id="field"></canvas>

<div class="sample" id="sample">
  <h1>Web services for <em>your</em> small business</h1>
  <p>A custom website with a chatbot that answers your visitors and booking that fills your calendar. Built, hosted and looked after by our own US team.</p>
  <span class="cta">Get a free demo</span>
</div>

<div id="fps">0 fps</div>
<button id="toggle">panel</button>
<div id="panel"></div>

<script>
// ---------------------------------------------------------------- config
const D = {
  preset:'wildflowers',
  seed:7, count:900, horizon:.42, persp:1.0, farScale:.26, spread:1.0, clump:.65, patches:16,
  cell:13, lh:1.0, bold:0, font:0,
  height:20, heightVar:.55, flowerMix:.45, spikeMix:.55, headLen:4, grassH:.6,
  windSpeed:.5, sway:2.2, turb:.4, gust:.9, gustLen:1.3, gustSpeed:.3, depthLag:1.4, stillness:0,
  fog:.8, bright:1, sat:1, mono:0, glow:.3, scrim:.2,
  bg:'#09090b', stem:'#4c7a3d', stemFar:'#2a4230',
  c1:'#a35fd8', c2:'#ff7a2f', c3:'#ffc23d', c4:'#e2506b',
  sky:0, skyTop:'#0d1016', ground:0, groundCol:'#101510',
  stems:"|!Ii:'.", heads:"*%@#&o+",
  imgMode:'off', imgOpacity:1, imgContrast:1.25, imgBright:1, imgSat:1.15, imgCut:.12,
  imgSway:2.4, imgWave:.35, imgMask:.35, imgTurb:.4, imgColor:'photo',
  ramp:" .'`:,^*oO0%#@",
  sample:1, paused:0,
};
const P = Object.assign({}, D, JSON.parse(localStorage.getItem('field') || '{}'));
const FONTS = ['ui-monospace, Menlo, monospace', '"Courier New", monospace', 'Consolas, monospace'];

const PRESETS = {
  wildflowers:{},
  grass:{flowerMix:0, count:1200, height:16, grassH:1, stem:'#6f8f45', stemFar:'#2f4030', sway:2.6, cell:12},
  meadow:{mono:1, count:600, glow:.15, fog:.9, cell:12, sway:1.8, stem:'#9aa08f'},
  storm:{windSpeed:1.1, sway:4.2, gust:1.4, gustSpeed:.55, turb:.7, count:620},
  sparse:{count:220, cell:16, height:26, sway:1.6, fog:.6},
};

// ---------------------------------------------------------------- scene
const cvs = document.getElementById('field'), ctx = cvs.getContext('2d', { alpha:false });
let W = 0, H = 0, cw = 0, chh = 0, plants = [], t0 = performance.now();

const rng = s => () => (s = s * 16807 % 2147483647) / 2147483647;
const lerp = (a, b, k) => a + (b - a) * k;
const hex = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
const rgb = c => `rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;
const mix = (a, b, k) => [lerp(a[0],b[0],k), lerp(a[1],b[1],k), lerp(a[2],b[2],k)];

function tune(c){                                   // saturation and brightness, applied to every plant color
  const l = c[0]*.299 + c[1]*.587 + c[2]*.114;
  const s = P.mono ? 0 : P.sat;
  return c.map(v => Math.min(255, lerp(l, v, s) * P.bright));
}

function build(){
  const r = rng(P.seed * 9973 + 11);
  const cols = [P.c1, P.c2, P.c3, P.c4].map(hex);
  const patch = [];
  for (let i = 0; i < P.patches; i++) patch.push({ x: r() * 1.3 - .15, d: r(), c: Math.floor(r() * 4) });
  plants = [];
  for (let i = 0; i < P.count; i++){
    const inPatch = patch.length && r() < P.clump;
    const c = inPatch ? patch[Math.floor(r() * patch.length)] : null;
    const spray = () => (r() + r() + r() - 1.5) * .12;      // three rolls, so a patch falls off softly at its edge
    const d = Math.min(.999, Math.max(0, inPatch ? c.d + spray() * .7
                                                 : Math.pow(r(), 1 / Math.max(.2, P.spread))));
    const flower = r() < P.flowerMix;
    plants.push({
      x: inPatch ? c.x + spray() : (r() * 1.3 - .15), d,
      h: P.height * (flower ? 1 : P.grassH) * (1 + (r() - .5) * P.heightVar * 2),
      phase: r() * 6.28, stiff: .6 + r() * .8, lean: (r() - .5) * .6,
      flower, spike: r() < P.spikeMix, heads: 2 + Math.floor(r() * P.headLen),
      col: tune(cols[inPatch && r() < .8 ? c.c : Math.floor(r() * 4)]), gi: Math.floor(r() * 7),
    });
  }
  plants.sort((a, b) => a.d - b.d);                        // far first, so near plants paint over
}

function size(){
  const dpr = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cvs.width = W * dpr; cvs.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.font = `${P.bold ? 700 : 400} ${P.cell}px ${FONTS[P.font]}`;
  cw = ctx.measureText('M').width; chh = P.cell * P.lh;
  ctx.textBaseline = 'middle';
}

// ---------------------------------------------------------------- draw
function gustAt(x, time){
  // one slow wave travelling across the field, so the wind reads as a gust crossing it
  const w = Math.sin(time * P.gustSpeed * 6.28 - x * P.gustLen * 6.28);
  return 1 + P.gust * w * .5;
}

function draw(time){
  const bg = hex(P.bg);
  ctx.fillStyle = P.bg; ctx.fillRect(0, 0, W, H);
  if (P.imgMode !== 'off') photo(time);
  if (P.imgMode === 'photo' || P.imgMode === 'ascii') return;
  const hy = H * P.horizon;

  if (P.sky){
    const g = ctx.createLinearGradient(0, 0, 0, hy);
    g.addColorStop(0, P.skyTop); g.addColorStop(1, P.bg);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, hy);
  }
  if (P.ground){ ctx.fillStyle = P.groundCol; ctx.fillRect(0, hy, W, H - hy); }

  const stem = tune(hex(P.stem)), stemFar = tune(hex(P.stemFar));
  const near = [...P.stems], heads = [...P.heads];
  ctx.shadowBlur = 0;

  for (const p of plants){
    const dd = Math.pow(p.d, P.persp);
    const scale = lerp(P.farScale, 1, dd);
    const baseY = lerp(hy, H, dd);
    if (baseY < -chh) continue;
    const segs = Math.max(2, Math.round(p.h * scale));
    const g = gustAt(p.x, time);
    const amp = P.sway * cw * scale * p.stiff * g * (1 - P.stillness);
    const px = p.x * W;
    let lx = px, ly = baseY, x = px, y = baseY;

    for (let i = 0; i <= segs; i++){
      const u = i / segs;
      const k = Math.pow(u, 1.7);
      const w1 = Math.sin(time * P.windSpeed * 6.28 + p.phase + p.d * P.depthLag * 6.28);
      const w2 = Math.sin(time * P.windSpeed * 11 + p.phase * 2.3) * P.turb;
      x = px + (w1 + w2) * amp * k + p.lean * cw * k * 3;
      y = baseY - u * p.h * scale * chh;
      if (i === 0){ lx = x; ly = y; continue; }

      const slope = (x - lx) / Math.max(1, ly - y);
      const far = 1 - dd;
      let ch = slope > .55 ? '/' : slope < -.55 ? '\\' : near[Math.min(near.length - 1, Math.round(far * 4))];
      if (u > .8 && !p.flower) ch = far > .5 ? '.' : ',';
      ctx.fillStyle = rgb(mix(mix(stem, stemFar, far), bg, far * P.fog));
      cell(x, y, ch);
      lx = x; ly = y;
    }

    if (!p.flower) continue;
    const far = 1 - dd;
    const col = mix(p.col, bg, far * P.fog * .85);
    ctx.fillStyle = rgb(col);
    if (P.glow > 0 && dd > .45){ ctx.shadowColor = rgb(p.col); ctx.shadowBlur = P.glow * 14 * dd; }
    if (p.spike){                                   // a vertical cluster, like the purple horsemint spikes
      for (let k = 0; k < p.heads; k++){
        const yy = y - k * chh, kk = k / p.heads;
        ctx.globalAlpha = 1 - kk * .35;
        cell(x + Math.sin(time * P.windSpeed * 6.28 + p.phase) * amp * .25 * kk, yy, heads[(p.gi + k) % heads.length]);
      }
    } else {                                        // a round head with two dimmer petals beside it
      cell(x, y, heads[p.gi % heads.length]);
      ctx.globalAlpha = .55;
      cell(x - cw, y, '.'); cell(x + cw, y, '.');
    }
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  }
}

function scrimPass(){
  if (P.scrim <= 0) return;
  ctx.globalAlpha = P.scrim; ctx.fillStyle = P.bg; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
}

// ---------------------------------------------------------------- photo
const IMG = { el:null, data:null, cols:0, rows:0 };

function loadImage(src, keep){
  const im = new Image();
  im.onload = () => {
    IMG.el = im; sample();
    if (keep){                                   // stash a small copy so a reload keeps the photo
      const c = document.createElement('canvas'), k = Math.min(1, 900 / im.width);
      c.width = im.width * k; c.height = im.height * k;
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      try { localStorage.setItem('fieldImg', c.toDataURL('image/jpeg', .72)); } catch(e){}
    }
    if (P.imgMode === 'off'){ P.imgMode = 'ascii'; render(); }
    apply();
  };
  im.src = src;
}

function sample(){
  if (!IMG.el || !cw) return;
  const cols = Math.ceil(W / cw) + 1, rows = Math.ceil(H / chh) + 1;
  const oc = document.createElement('canvas'); oc.width = cols; oc.height = rows;
  const o = oc.getContext('2d');
  const k = Math.max(cols / IMG.el.width, rows / IMG.el.height);     // cover
  const dw = IMG.el.width * k, dh = IMG.el.height * k;
  o.drawImage(IMG.el, (cols - dw) / 2, (rows - dh) / 2, dw, dh);
  IMG.data = o.getImageData(0, 0, cols, rows).data; IMG.cols = cols; IMG.rows = rows;
}

function photo(time){
  if (!IMG.el) return;
  if (P.imgMode === 'photo'){                                        // the plain picture, for comparison
    ctx.globalAlpha = P.imgOpacity;
    const k = Math.max(W / IMG.el.width, H / IMG.el.height);
    ctx.drawImage(IMG.el, (W - IMG.el.width * k) / 2, (H - IMG.el.height * k) / 2,
                  IMG.el.width * k, IMG.el.height * k);
    ctx.globalAlpha = 1; return;
  }
  if (!IMG.data) return;
  const ramp = [...P.ramp], d = IMG.data, bg = hex(P.bg);
  const cols4 = [P.c1, P.c2, P.c3, P.c4].map(hex).map(tune);
  ctx.globalAlpha = P.imgOpacity;
  for (let r = 0; r < IMG.rows; r++){
    const m = Math.max(0, (r / IMG.rows - P.imgMask) / Math.max(.01, 1 - P.imgMask));
    const mask = m * m;                                              // only the near ground sways
    const wave = Math.sin(time * P.windSpeed * 6.28 + r * P.imgWave) * P.imgSway * mask
               * (1 + P.gust * Math.sin(time * P.gustSpeed * 6.28) * .5) * (1 - P.stillness);
    for (let c = 0; c < IMG.cols; c++){
      const jitter = Math.sin(time * P.windSpeed * 11 + c * .7 + r * .3) * P.imgTurb * mask;
      const sc = Math.min(IMG.cols - 1, Math.max(0, Math.round(c + wave + jitter)));
      const i = (r * IMG.cols + sc) * 4;
      let col = [d[i], d[i+1], d[i+2]];
      let l = (col[0] * .299 + col[1] * .587 + col[2] * .114) / 255;
      l = Math.min(1, Math.max(0, (l - .5) * P.imgContrast + .5 + (P.imgBright - 1)));
      if (l < P.imgCut) continue;
      const ch = ramp[Math.min(ramp.length - 1, Math.floor(l * ramp.length))];
      if (ch === ' ') continue;
      if (P.imgColor === 'palette'){
        const h = Math.atan2(1.732 * (col[1] - col[2]), 2 * col[0] - col[1] - col[2]);
        col = cols4[Math.floor(((h + Math.PI) / 6.284) * 4) % 4];
      } else if (P.imgColor === 'mono') col = [236, 237, 232];
      col = tune(col);
      ctx.fillStyle = rgb(mix(col, bg, (1 - l) * P.fog * .6));
      ctx.fillText(ch, c * cw, r * chh);
    }
  }
  ctx.globalAlpha = 1;
}

function cell(x, y, ch){                            // snap to the character grid, so it stays true ascii
  ctx.fillText(ch, Math.round(x / cw) * cw, Math.round(y / chh) * chh);
}

let last = performance.now(), fps = 60, clock = 0;
function loop(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (!P.paused) clock += dt;
  fps = lerp(fps, 1 / Math.max(.001, dt), .08);
  document.getElementById('fps').textContent = `${fps.toFixed(0)} fps · ${plants.length} plants`;
  draw(clock); scrimPass();
  requestAnimationFrame(loop);
}

// ---------------------------------------------------------------- panel
const panel = document.getElementById('panel');
const GROUPS = [
  ['Field', [
    ['count','plants',60,1600,10],['horizon','horizon line',.1,.85,.01],['spread','depth spread',.3,3,.05],
    ['persp','perspective',.4,3,.05],['farScale','far size',.05,1,.01],
    ['clump','patchiness',0,1,.02],['patches','patch count',1,60,1],['seed','seed',1,200,1],
  ]],
  ['Plants', [
    ['height','height',4,60,1],['heightVar','height variety',0,1,.02],
    ['flowerMix','flowers vs grass',0,1,.02],['spikeMix','spikes vs round heads',0,1,.02],
    ['grassH','grass height',.1,1.5,.02],
    ['headLen','head length',1,10,1],
  ]],
  ['Glyphs', [
    ['cell','glyph size',6,32,1],['lh','line height',.6,1.6,.02],['glow','head glow',0,1,.02],
  ]],
  ['Wind', [
    ['windSpeed','wind speed',0,2,.02],['sway','sway amount',0,8,.05],['turb','turbulence',0,1,.02],
    ['gust','gust strength',0,2,.02],['gustLen','gust wavelength',.2,4,.05],['gustSpeed','gust speed',0,1.5,.02],
    ['depthLag','depth stagger',0,4,.05],['stillness','stillness',0,1,.02],
  ]],
  ['Color', [
    ['fog','depth fade',0,1,.02],['bright','brightness',.2,2,.02],['sat','saturation',0,2,.02],
    ['scrim','text scrim',0,.85,.01],
  ]],
];

function render(){
  panel.innerHTML = '';
  add('Presets');
  const pr = el('div','opts');
  Object.keys(PRESETS).forEach(k => {
    const b = el('button','chip'); b.textContent = k; b.classList.toggle('on', P.preset === k);
    b.onclick = () => { Object.assign(P, D, PRESETS[k], {preset:k}); apply(true); render(); };
    pr.append(b);
  });
  panel.append(pr);

  for (const [name, rows] of GROUPS){
    add(name);
    for (const [key, label, min, max, step] of rows){
      const r = el('div','row');
      const l = el('label'); l.textContent = label;
      const o = el('output'); o.textContent = fmt(P[key]);
      const i = document.createElement('input');
      Object.assign(i, {type:'range', min, max, step, value:P[key]});
      i.oninput = () => { P[key] = +i.value; o.textContent = fmt(P[key]); apply(key === 'seed' || key === 'count' || key === 'clump' || key === 'patches' || key === 'grassH' || key === 'height' || key === 'heightVar' || key === 'flowerMix' || key === 'spikeMix' || key === 'headLen' || key === 'spread'); };
      r.append(l, o, i); panel.append(r);
    }
  }

  add('Palette');
  const sw = el('div','swatches');
  [['c1','flower 1'],['c2','flower 2'],['c3','flower 3'],['c4','flower 4'],['stem','stem near'],['stemFar','stem far']]
    .forEach(([k, title]) => {
      const c = document.createElement('input');
      Object.assign(c, {type:'color', value:P[k], title});
      c.oninput = () => { P[k] = c.value; apply(true); };
      sw.append(c);
    });
  panel.append(sw);
  const bgr = el('div','swatches');
  [['bg','background'],['skyTop','sky top'],['groundCol','ground']].forEach(([k, title]) => {
    const c = document.createElement('input');
    Object.assign(c, {type:'color', value:P[k], title});
    c.oninput = () => { P[k] = c.value; apply(); };
    bgr.append(c);
  });
  panel.append(bgr);

  add('Switches');
  [['mono','monochrome'],['bold','bold glyphs'],['sky','sky gradient'],['ground','ground fill'],
   ['sample','sample copy'],['paused','pause']].forEach(([k, label]) => {
    const w = el('label','check'); const c = document.createElement('input');
    c.type = 'checkbox'; c.checked = !!P[k];
    c.onchange = () => { P[k] = c.checked ? 1 : 0; apply(k === 'mono'); };
    w.append(c, document.createTextNode(label)); panel.append(w);
  });

  add('Glyph sets');
  const gs = el('div','opts');
  [['stems','stem'],['heads','head']].forEach(([k, label]) => {
    const i = document.createElement('input');
    Object.assign(i, {value:P[k], title:label});
    i.className = 'chip'; i.style.width = '130px'; i.style.fontFamily = 'var(--mono)';
    i.oninput = () => { P[k] = i.value || D[k]; apply(); };
    gs.append(i);
  });
  panel.append(gs);
  const fs = document.createElement('select');
  FONTS.forEach((f, n) => { const o = document.createElement('option'); o.value = n; o.textContent = f.split(',')[0]; fs.append(o); });
  fs.value = P.font; fs.onchange = () => { P.font = +fs.value; apply(); };
  panel.append(fs);

  add('Photo');
  const modes = el('div','opts');
  [['off','off'],['ascii','ascii photo'],['both','photo plus plants'],['photo','plain photo']]
    .forEach(([k, label]) => {
      const b = el('button','chip'); b.textContent = label; b.classList.toggle('on', P.imgMode === k);
      b.onclick = () => { P.imgMode = k; apply(); render(); };
      modes.append(b);
    });
  panel.append(modes);
  const fh = el('div','hint');
  fh.textContent = 'Paste an image with cmd v, drop one anywhere, or pick a file.';
  const file = document.createElement('input'); file.type = 'file'; file.accept = 'image/*';
  file.className = 'chip'; file.style.width = '100%';
  file.onchange = () => { const f = file.files[0]; if (f) loadImage(URL.createObjectURL(f), true); };
  panel.append(fh, file);
  for (const [key, label, min, max, step] of [
    ['imgOpacity','photo strength',0,1,.02],['imgContrast','contrast',.3,3,.02],
    ['imgBright','brightness',.3,2,.02],['imgCut','dark cutoff',0,.6,.01],
    ['imgSway','photo sway',0,8,.1],['imgWave','sway wavelength',0,1.5,.02],
    ['imgMask','sway starts at',0,.95,.01],['imgTurb','photo turbulence',0,3,.05],
  ]){
    const r = el('div','row'), l = el('label'), o = el('output');
    l.textContent = label; o.textContent = fmt(P[key]);
    const i = document.createElement('input');
    Object.assign(i, {type:'range', min, max, step, value:P[key]});
    i.oninput = () => { P[key] = +i.value; o.textContent = fmt(P[key]); apply(); };
    r.append(l, o, i); panel.append(r);
  }
  const cs = el('div','opts');
  [['photo','photo color'],['palette','palette tint'],['mono','monochrome']].forEach(([k, label]) => {
    const b = el('button','chip'); b.textContent = label; b.classList.toggle('on', P.imgColor === k);
    b.onclick = () => { P.imgColor = k; apply(); render(); };
    cs.append(b);
  });
  panel.append(cs);
  const rp = document.createElement('input');
  Object.assign(rp, {value:P.ramp, title:'glyph ramp, dark to light'});
  rp.className = 'chip'; rp.style.cssText = 'width:100%;font-family:var(--mono);margin-top:6px';
  rp.oninput = () => { P.ramp = rp.value || D.ramp; apply(); };
  panel.append(rp);

  add('Config');
  const hint = el('div','hint'); hint.textContent = 'Paste this back to me and I will wire it into the site.';
  const ta = document.createElement('textarea'); ta.id = 'cfg'; ta.value = JSON.stringify(P);
  const acts = el('div','opts');
  acts.append(
    chip('copy', () => { navigator.clipboard.writeText(JSON.stringify(P, null, 1)); }),
    chip('apply pasted', () => { try { Object.assign(P, JSON.parse(ta.value)); apply(true); render(); } catch(e){ alert('that is not valid config'); } }),
    chip('reroll', () => { P.seed = 1 + Math.floor(Math.random() * 200); apply(true); render(); }),
    chip('reset', () => { Object.assign(P, D); apply(true); render(); }),
  );
  panel.append(hint, ta, acts);
}

const el = (tag, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; return e; };
const add = txt => { const h = document.createElement('h2'); h.textContent = txt; panel.append(h); };
const chip = (txt, fn) => { const b = el('button','chip'); b.textContent = txt; b.onclick = fn; return b; };
const fmt = v => (v % 1 ? v.toFixed(2) : v);

function apply(rebuild){
  size();
  sample();
  if (rebuild) build();
  document.getElementById('sample').classList.toggle('on', !!P.sample);
  const cfg = document.getElementById('cfg'); if (cfg) cfg.value = JSON.stringify(P);
  localStorage.setItem('field', JSON.stringify(P));
}

document.getElementById('toggle').onclick = () => panel.classList.toggle('hide');
addEventListener('resize', () => apply());
addEventListener('keydown', e => {
  if (e.key === ' '){ e.preventDefault(); P.paused ^= 1; render(); }
  if (e.key === 'r'){ P.seed = 1 + Math.floor(Math.random() * 200); apply(true); render(); }
  if (e.key === 'p') panel.classList.toggle('hide');
});

addEventListener('paste', e => {
  const it = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
  if (it) loadImage(URL.createObjectURL(it.getAsFile()), true);
});
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => {
  e.preventDefault();
  const f = [...(e.dataTransfer?.files || [])].find(f => f.type.startsWith('image/'));
  if (f) loadImage(URL.createObjectURL(f), true);
});

render(); apply(true);
const saved = localStorage.getItem('fieldImg'); if (saved) loadImage(saved, false);
requestAnimationFrame(loop);
</script></body></html>
